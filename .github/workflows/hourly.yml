name: Hourly feed

on:
  schedule:
    # A couple of minutes past the hour: GitHub delays jobs queued exactly on the hour the most.
    - cron: "2 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Photos shown lately
        run: |
          if git fetch --depth=1 origin feed 2>/dev/null; then git show FETCH_HEAD:seen.json > seen.json || echo '{}' > seen.json
          else echo '{}' > seen.json; fi

      - name: Build this hour's feed
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/build.mjs out seen.json

      # The feed branch holds one commit with the two JSON files, replaced every hour, so the repo never grows.
      - name: Publish
        working-directory: out
        run: |
          git init -q -b feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explore.json seen.json
          git commit -q -m "Feed for $(date -u +%Y-%m-%dT%H:00Z)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
